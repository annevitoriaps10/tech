<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil — TechEmpire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="perfil" data-auth="client">
<header id="site-header"></header>
<main class="wrap-main">
<div class="panel"><h2>Meu perfil</h2><p class="sub">CPF e e-mail não podem ser alterados aqui.</p>
<form id="f-perfil">
  <label>Nome completo<input name="nome" required></label>
  <div class="two"><label>CPF<input name="cpf" disabled></label><label>E-mail<input name="email" disabled></label></div>
  <label>Telefone/WhatsApp<input name="telefone" inputmode="tel"></label>
  <div class="two"><label>Rua<input name="rua"></label><label>Número<input name="numero"></label></div>
  <div class="two"><label>Bairro<input name="bairro"></label><label>Cidade<input name="cidade"></label></div>
  <label>Estado (UF)<input name="estado" maxlength="2"></label>
  <div class="msg" id="m-perfil" role="alert"></div><button class="btn primary" type="submit">Salvar dados</button>
</form></div>
<div class="panel" style="margin-top:20px"><h3>Alterar senha</h3>
<form id="f-senha"><label>Nova senha (mín. 8)<input name="senha" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar<input name="senha2" type="password" minlength="8" required autocomplete="new-password"></label><div class="msg" id="m-senha" role="alert"></div><button class="btn" type="submit">Alterar senha</button></form></div>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
